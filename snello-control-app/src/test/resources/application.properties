quarkus.compose.devservices.enabled=true
quarkus.compose.devservices.files=../docker-compose/compose-test.yml

quarkus.datasource.db-kind=postgresql
# docker-compose/compose-test.yml publishes Postgres on host 5433 (keeps 5432 free for local stack)
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/snello
quarkus.datasource.username=snello
quarkus.datasource.password=snello

quarkus.oidc.enabled=false
quarkus.smallrye-jwt.enabled=false

# In tests we allow write methods on /api/* to exercise REST create/update flows.
quarkus.http.auth.permission.roles1.policy=permit

quarkus.log.level=INFO


# tests call a local JDK HttpServer from scripts
%test.snello.http.allow-private=true

# timer off in tests: they call ScheduledActionService.runDue() directly
%test.snello.scheduled-actions.enabled=false

# Workflow definitions deploy: WorkflowDefinitionsTest runs a fake flow-bridge on this port
%test.snello.flow.bridge-url=http://127.0.0.1:18391
%test.snello.flow.bridge-token=wf-test-token
# HumanTaskWorkflowStateTest: fake runner (cancel from the monitor) on the same fake server
%test.snello.flow.url=http://127.0.0.1:18391/runner

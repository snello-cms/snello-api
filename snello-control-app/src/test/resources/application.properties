quarkus.compose.devservices.enabled=true
quarkus.compose.devservices.files=../compose-test.yml

snello.dbtype=postgresql
quarkus.datasource.db-kind=postgresql
# compose-test.yml publishes Postgres on host 5433 (keeps 5432 free for local stack)
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/snello
quarkus.datasource.username=snello
quarkus.datasource.password=snello

quarkus.oidc.enabled=false
quarkus.smallrye-jwt.enabled=false

# In tests we allow write methods on /api/* to exercise REST create/update flows.
quarkus.http.auth.permission.roles1.policy=permit

quarkus.log.level=INFO

%test.snello.scheduler.script=mail.send("tick", "<p>tick</p>", java.util.List.of("sched@rent.it"), null, null, null);

# tests call a local JDK HttpServer from scripts
%test.snello.http.allow-private=true

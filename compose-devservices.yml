# Quarkus Compose Dev Services stack (local %dev).
# Images pinned to current stable/community releases (Nov 2026).
name: snello-dev

services:
  postgresql:
    image: postgres:18.6
    environment:
      POSTGRES_DB: snello
      POSTGRES_USER: snello
      POSTGRES_PASSWORD: snello
    ports:
      - "5432:5432"
    volumes:
      - snello-pgdata:/var/lib/postgresql
      - ./dev/db/backup_04_04_2026.backup.sql:/tmp/backup_04_04_2026.backup.sql:ro
      - ./dev/db/init-postgresql-restore.sh:/docker-entrypoint-initdb.d/10-restore.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snello -d snello"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname-strict=false
    ports:
      - "8180:8080"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Official minio/minio images are no longer publicly pullable; pgsty/silo is a community MinIO fork.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - snello-minio:/data
  minio-init:
    image: amazon/aws-cli:2.31.38
    depends_on:
      minio:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do
          echo "Waiting for MinIO..."
          sleep 2
        done
        aws --endpoint-url http://minio:9000 s3 mb s3://snello 2>/dev/null || true
        echo "MinIO bucket snello ready"
        exit 0
    restart: "no"

volumes:
  snello-pgdata:
  snello-minio:

# All-in-one + local Keycloak (realm from dev/keycloak — same dump used in compose.yml).
# Ports avoid clash with full stack (:8080/:8180):
#   all-in-one → http://127.0.0.1:18080
#   keycloak  → http://127.0.0.1:18180
#
#   ./mvnw -pl snello-all-in-one-app -am package -Dmaven.test.skip=true
#   docker compose -f compose-allinone-local.yml up -d --build
#
name: snello-allinone-local

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname-strict=false
    ports:
      - "18180:8080"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  snello-all-in-one:
    image: snellocms/snello-all-in-one:local
    build:
      context: ./snello-all-in-one-app
      dockerfile: src/main/docker/Dockerfile.jvm
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      SNELLO_DB_KIND: h2
      SNELLO_JDBC_URL: jdbc:h2:mem:snello;DB_CLOSE_DELAY=-1;MODE=MySQL;IGNORECASE=TRUE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
      SNELLO_FS_BASE_PATH: /data/files
      # Same docker network → issuer matches tokens minted against http://keycloak:8080/...
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/snello
      QUARKUS_OIDC_CLIENT_ID: snello-api
      QUARKUS_OIDC_APPLICATION_TYPE: service
      QUARKUS_OIDC_ROLES_ROLE_CLAIM_PATH: resource_access/snello-api/roles
      # Point named tenant at same realm so static init does not hit sso.example placeholders
      QUARKUS_OIDC_SNELLO_AUTH_SERVER_URL: http://keycloak:8080/realms/snello
      QUARKUS_OIDC_SNELLO_CLIENT_ID: snello-api
      SNELLO_KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      SNELLO_KEYCLOAK_ADMIN_AUTH_REALM: master
      SNELLO_KEYCLOAK_ADMIN_TARGET_REALM: snello
      SNELLO_KEYCLOAK_ADMIN_USERNAME: admin
      SNELLO_KEYCLOAK_ADMIN_PASSWORD: admin
      QUARKUS_LOG_CATEGORY__IO_QUARKUS_OIDC__LEVEL: DEBUG
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/datalist/names HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\\[' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 50s

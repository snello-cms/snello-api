# Quarkus Compose Dev Services stack for tests (%test / CI).
name: snello-test

services:
  postgresql:
    image: postgres:18.6
    environment:
      POSTGRES_DB: snello
      POSTGRES_USER: snello
      POSTGRES_PASSWORD: snello
    ports:
      - "5432:5432"
    volumes:
      - ./dev/db:/seed:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        # Copy init script into the container FS so shebang execution works on macOS mounts.
        cp /seed/backup_04_04_2026.backup.sql /tmp/backup_04_04_2026.backup.sql
        cp /seed/init-postgresql-restore.sh /docker-entrypoint-initdb.d/10-restore.sh
        chmod +x /docker-entrypoint-initdb.d/10-restore.sh
        exec /usr/local/bin/docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snello -d snello"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

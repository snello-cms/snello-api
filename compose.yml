# Full local stack: dependencies + snello-control 6.x alpha image.
# Usage (images are built from the local modules, so package them first):
#   ./mvnw package -DskipTests
#   docker compose up -d --build
name: snello

services:
  postgresql:
    image: postgres:18.6
    environment:
      POSTGRES_DB: snello
      POSTGRES_USER: snello
      POSTGRES_PASSWORD: snello
    ports:
      - "5432:5432"
    volumes:
      - snello-pgdata:/var/lib/postgresql
      - ./dev/db:/seed:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        cp /seed/backup_04_04_2026.backup.sql /tmp/backup_04_04_2026.backup.sql
        cp /seed/init-postgresql-restore.sh /docker-entrypoint-initdb.d/10-restore.sh
        chmod +x /docker-entrypoint-initdb.d/10-restore.sh
        exec /usr/local/bin/docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snello -d snello"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname-strict=false
    ports:
      - "8180:8080"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # no curl in the image: plain HTTP over bash /dev/tcp against the management port
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - snello-minio:/data

  minio-init:
    image: amazon/aws-cli:2.31.38
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do
          echo "Waiting for MinIO..."
          sleep 2
        done
        aws --endpoint-url http://minio:9000 s3 mb s3://snello 2>/dev/null || true
        exit 0
    restart: "no"

  snello-control:
    image: snellocms/snello-control:alpha
    build:
      context: ./snello-control-app
      dockerfile: src/main/docker/Dockerfile.jvm
    depends_on:
      postgresql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      SNELLO_DB_KIND: postgresql
      SNELLO_DBTYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgresql:5432/snello
      QUARKUS_DATASOURCE_USERNAME: snello
      QUARKUS_DATASOURCE_PASSWORD: snello
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/snello
      QUARKUS_OIDC_SNELLO_AUTH_SERVER_URL: http://keycloak:8080/realms/lovers
      # Keycloak admin client: local container, master-realm bootstrap admin (default points at a remote SSO)
      SNELLO_KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      SNELLO_KEYCLOAK_ADMIN_AUTH_REALM: master
      SNELLO_KEYCLOAK_ADMIN_TARGET_REALM: snello
      SNELLO_KEYCLOAK_ADMIN_USERNAME: admin
      SNELLO_KEYCLOAK_ADMIN_PASSWORD: admin
      QUARKUS_MINIO_URL: http://minio:9000
      QUARKUS_MINIO_ACCESS_KEY: minio
      QUARKUS_MINIO_SECRET_KEY: minio123

  # Read-only query plane (GET /api/{table}...): no DDL, no writes, no admin RS, no AI runtime.
  # Picks up metadata changes made on control within SNELLO_METADATA_REFRESH_INTERVAL.
  snello-query:
    image: snellocms/snello-query:alpha
    build:
      context: ./snello-query-app
      dockerfile: src/main/docker/Dockerfile.jvm
    depends_on:
      postgresql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      snello-control:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      SNELLO_DB_KIND: postgresql
      SNELLO_DBTYPE: postgresql
      SNELLO_METADATA_REFRESH_INTERVAL: 10s
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgresql:5432/snello
      QUARKUS_DATASOURCE_USERNAME: snello
      QUARKUS_DATASOURCE_PASSWORD: snello
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/snello
      QUARKUS_OIDC_SNELLO_AUTH_SERVER_URL: http://keycloak:8080/realms/lovers
      QUARKUS_MINIO_URL: http://minio:9000
      QUARKUS_MINIO_ACCESS_KEY: minio
      QUARKUS_MINIO_SECRET_KEY: minio123

volumes:
  snello-pgdata:
  snello-minio:

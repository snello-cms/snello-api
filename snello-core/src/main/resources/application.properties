# Shared OpenAPI defaults (merged into every Quarkus app that depends on snello-core).
# JSON document is also exposed at GET /openapi via OpenApiServiceRs.
quarkus.smallrye-openapi.info-title=Snello API
quarkus.smallrye-openapi.info-version=${quarkus.application.version:6.0.2-alpha}
quarkus.smallrye-openapi.info-description=Snello metadata-driven headless CMS API (JAX-RS surface of this runtime plane)
quarkus.smallrye-openapi.auto-add-security-requirement=false

# Configuration file
# key = value

snello.runtime=query
# Query plane: GET /api/{table}[/{id}] only; no DDL, no writes, no admin RS
# Build-time: evaluated at (re-)augmentation, see io.snello.management.SnelloPlane
snello.control-plane.enabled=false
# Metadata snapshot checksum poll ("off" = rely on CDI events from this same node)
snello.metadata.refresh-interval=${SNELLO_METADATA_REFRESH_INTERVAL:30s}

# Dev Services via Docker Compose
%dev.quarkus.compose.devservices.enabled=true
%dev.quarkus.compose.devservices.files=../compose-devservices.yml
# first start restores the DB dump and imports the Keycloak realm: give it more than the default wait
%dev.quarkus.compose.devservices.startup-timeout=3m

# ============ DATABASE (single default DS + Keycloak-style re-augmentation) ============
# Build-time: quarkus.datasource.db-kind (specialize with snello-optimize.sh / quarkus.launch.rebuild).
# Runtime: jdbc url / credentials. snello.dbtype must match the augmented db-kind.
quarkus.package.jar.type=mutable-jar

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=snello
quarkus.datasource.password=snello
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/snello
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20
# Driver-level hint; Query plane also forces Connection.setReadOnly(true) via ReadOnlyConnectionInterceptor
quarkus.datasource.jdbc.additional-jdbc-properties.readOnly=true

# Dialect selector for JdbcRepository (must match db-kind after optimize)
snello.dbtype=postgresql
%dev.snello.dbtype=postgresql

# Optional H2 URL when re-augmented with SNELLO_DB_KIND=h2
%h2.quarkus.datasource.jdbc.url=jdbc:h2:mem:snello;DB_CLOSE_DELAY=-1;MODE=MySQL;IGNORECASE=TRUE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
%h2.quarkus.datasource.username=sa
%h2.quarkus.datasource.password=

# mail
# mail: any SMTP provider (Brevo / Resend / Mailjet / SendGrid ...), all from env. Mock (no real send) until
# SNELLO_MAIL_MOCK=false. Brevo: smtp-relay.brevo.com:587 STARTTLS; SendGrid: smtp.sendgrid.net:587, user "apikey".
snello.mailtype=smtp
quarkus.mailer.from=${SNELLO_MAIL_FROM:hypercube.mk@gmail.com}
quarkus.mailer.host=${SNELLO_MAIL_HOST:smtp-relay.brevo.com}
quarkus.mailer.port=${SNELLO_MAIL_PORT:587}
quarkus.mailer.start-tls=${SNELLO_MAIL_STARTTLS:REQUIRED}
quarkus.mailer.tls=${SNELLO_MAIL_TLS:false}
quarkus.mailer.username=${SNELLO_MAIL_USERNAME:c25718001@smtp-brevo.com}
quarkus.mailer.password=${SNELLO_MAIL_PASSWORD:}
quarkus.mailer.mock=${SNELLO_MAIL_MOCK:false}
# SMTP password only from env SNELLO_MAIL_PASSWORD (local: dev/.env.mail, git-ignored); never commit it.
# Tests always use the mock mailbox. Set SNELLO_MAIL_MOCK=true to silence sending locally.
%test.quarkus.mailer.mock=true


# storage
snello.storagetype=s3
snello.s3.bucketname=snello
snello.s3.folder=snello
# S3 API port (9001 is the MinIO web console); host/port are deprecated in favour of url
quarkus.minio.url=http://localhost:9000
quarkus.minio.access-key=minio
quarkus.minio.secret-key=minio123


snello.fs.basePath=xxxx

# queries
snello.h2.queries.select-users=select 1
snello.h2.queries.select-classes=select * from classes

snello.mysql.queries.select-users=select 1
snello.mysql.queries.select-classes=select * from classes

snello.postgresql.queries.select-users=select 1
snello.postgresql.queries.select-classes=select * from classes


# OIDC
quarkus.ssl.native=true
quarkus.smallrye-jwt.enabled=false
quarkus.oidc.enabled=true
quarkus.oidc.auth-server-url=https://sso.kayak.love/auth/realms/snello
quarkus.oidc.client-id=snello-api

%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/snello

quarkus.oidc.tenant-enabled=true
quarkus.oidc.snello.auth-server-url=https://accounts.kayak.love/realms/lovers
quarkus.oidc.snello.client-id=accounting

# Extract roles from Keycloak client roles (resource_access.<client>.roles)
quarkus.oidc.roles.role-claim-path=resource_access/snello-api/roles
quarkus.oidc.snello.roles.role-claim-path=resource_access/snello-api/roles

%dev.quarkus.oidc.snello.auth-server-url=http://localhost:8180/realms/lovers
%dev.quarkus.oidc.snello.client-id=accounting

# Keycloak Admin Client (realm snello)
snello.keycloak.admin.server-url=https://sso.kayak.love
snello.keycloak.admin.auth-realm=snello
snello.keycloak.admin.target-realm=snello
snello.keycloak.admin.client-id=admin-cli
snello.keycloak.admin.grant-type=password
snello.keycloak.admin.username=changeme-admin
snello.keycloak.admin.password=changeme-password

snello-admin.username=mail@mail.it
snello-admin.password=changeme-password

%dev.snello.keycloak.admin.server-url=http://localhost:8180
# dev Keycloak (compose-devservices.yml): master-realm bootstrap admin, manages realm 'snello'
%dev.snello.keycloak.admin.auth-realm=master
%dev.snello.keycloak.admin.username=admin
%dev.snello.keycloak.admin.password=admin
%dev.snello.keycloak.admin.target-realm=snello
%dev.snello.keycloak.admin.client-id=admin-cli

quarkus.http.auth.policy.role-policy1.roles-allowed=Admin,Manager,User
quarkus.http.auth.permission.roles1.policy=role-policy1
quarkus.http.auth.permission.roles1.paths=/api/*
quarkus.http.auth.permission.roles1.methods=POST,PUT,DELETE,PATCH

quarkus.http.auth.permission.permit1.paths=/api/*
quarkus.http.auth.permission.permit1.policy=permit
quarkus.http.auth.permission.permit1.methods=OPTIONS,GET

# OpenAPI JSON document (public)
quarkus.http.auth.permission.openapi.paths=/openapi,/openapi/*,/q/openapi,/q/openapi/*
quarkus.http.auth.permission.openapi.policy=permit
quarkus.http.auth.permission.openapi.methods=GET,HEAD,OPTIONS

quarkus.http.auth.permission.permit2.paths=/api/auth,/api/auth/*
quarkus.http.auth.permission.permit2.policy=permit
quarkus.http.auth.permission.permit2.methods=OPTIONS

# Admin-only endpoints for auth management
quarkus.http.auth.policy.role-policy-admin.roles-allowed=Admin,admin
quarkus.http.auth.permission.auth-admin.policy=role-policy-admin
quarkus.http.auth.permission.auth-admin.paths=/api/auth,/api/auth/*
quarkus.http.auth.permission.auth-admin.methods=GET,POST,PUT,DELETE,PATCH

# Add this line at the bottom
quarkus.log.min-level=TRACE

# And add this specific category you missed, which is the heart of OIDC decisions
quarkus.log.category."io.quarkus.security".min-level=TRACE

quarkus.log.level=INFO
quarkus.log.category."io.quarkus.vertx.http.runtime.security".min-level=TRACE
quarkus.log.category."io.quarkus.smallrye.jwt".min-level=TRACE
quarkus.log.category."io.undertow.request.security".min-level=TRACE
quarkus.log.category."io.smallrye.jwt".min-level=TRACE
quarkus.log.category."io.quarkus.oidc.runtime".min-level=TRACE

# Caffeine cache for CacheDocumentServiceRs
quarkus.cache.caffeine."documents-fetch".maximum-size=2000
quarkus.cache.caffeine."documents-fetch".expire-after-write=10M

# No AI here: the query plane does not depend on snello-ai (LangChain4j lives in control / mcp).

# Main binary caches (images/download responses)
quarkus.cache.caffeine."documents-download".maximum-size=200
quarkus.cache.caffeine."documents-download".expire-after-write=15M

quarkus.cache.caffeine."documents-webp".maximum-size=200
quarkus.cache.caffeine."documents-webp".expire-after-write=15M

quarkus.cache.caffeine."documents-download-with-name".maximum-size=200
quarkus.cache.caffeine."documents-download-with-name".expire-after-write=15M

# ============ VIRTUAL THREADS ============
# Enabled via Java 21+ and quarkus-virtual-threads; resources use @RunOnVirtualThread.


name: Maven & Docker Build Native Image

on:
  push:
    branches: [ main, '6.0.0-alpha' ]
  pull_request:
    branches: [ main, '6.0.0-alpha' ]

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: snellocms/snello-api
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/snello-api

jobs:
  build:
    name: Build native image and push to Docker Hub + GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Extract Maven project version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Resolve image tags
        id: image_tags
        run: |
          VERSION="${APP_VERSION}"
          DH="${DOCKERHUB_IMAGE}"
          GH="${GHCR_IMAGE}"
          {
            echo "tags<<EOF"
            echo "${DH}:${VERSION}-native"
            echo "${GH}:${VERSION}-native"
            if echo "${VERSION}" | grep -qi 'alpha'; then
              echo "${DH}:alpha-native"
              echo "${GH}:alpha-native"
            else
              echo "${DH}:latest-native"
              echo "${GH}:latest-native"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Maven Package (Native)
        # LangChain4j OpenAI ObjectMapperHolder must init at runtime on Quarkus 4 / Jackson 3.
        run: >
          mvn clean package -DskipTests=true -Pnative
          -Dquarkus.native.container-build=true
          '-Dquarkus.native.additional-build-args=--initialize-at-run-time=io.quarkiverse.langchain4j.openai.common.OpenAiRestApi\$ObjectMapperHolder,--initialize-at-run-time=io.quarkiverse.langchain4j.QuarkusJsonCodecFactory\$SnakeCaseObjectMapperHolder'

      - name: Verify native runner artifact
        run: |
          ls -la target
          if ! ls target/*-runner >/dev/null 2>&1; then
            echo "Native runner not found in target/. Expected target/*-runner"
            exit 1
          fi

      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          platforms: linux/amd64,linux/arm64
          file: ./src/main/docker/Dockerfile.native-micro
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image_tags.outputs.tags }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

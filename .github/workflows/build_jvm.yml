name: Maven & Docker Build JVM Images

on:
  push:
    branches: [ main, '6.0.0-alpha' ]
  pull_request:
    branches: [ main, '6.0.0-alpha' ]

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_OWNER: snellocms
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: Build ${{ matrix.image }} JVM image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: snello-control
            module: snello-control-app
          - image: snello-query
            module: snello-query-app
          - image: snello-mcp
            module: snello-mcp-app
          - image: snello-all-in-one
            module: snello-all-in-one-app

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Extract Maven project version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Resolve image tags
        id: image_tags
        run: |
          VERSION="${APP_VERSION}"
          IMAGE="${{ matrix.image }}"
          DH="${DOCKERHUB_OWNER}/${IMAGE}"
          GH="ghcr.io/${GHCR_OWNER}/${IMAGE}"
          {
            echo "tags<<EOF"
            echo "${DH}:${VERSION}"
            echo "${GH}:${VERSION}"
            if echo "${VERSION}" | grep -qi 'alpha'; then
              echo "${DH}:alpha"
              echo "${GH}:alpha"
            else
              echo "${DH}:latest"
              echo "${GH}:latest"
            fi
            # Compat alias: control also published as snello-api during alpha
            if [ "${IMAGE}" = "snello-control" ]; then
              echo "${DOCKERHUB_OWNER}/snello-api:${VERSION}"
              echo "ghcr.io/${GHCR_OWNER}/snello-api:${VERSION}"
              if echo "${VERSION}" | grep -qi 'alpha'; then
                echo "${DOCKERHUB_OWNER}/snello-api:alpha"
                echo "ghcr.io/${GHCR_OWNER}/snello-api:alpha"
              else
                echo "${DOCKERHUB_OWNER}/snello-api:latest"
                echo "ghcr.io/${GHCR_OWNER}/snello-api:latest"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Maven Package
        run: mvn -pl ${{ matrix.module }} -am clean package -DskipTests=true

      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch JVM image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.module }}
          platforms: linux/amd64,linux/arm64
          file: ./${{ matrix.module }}/src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image_tags.outputs.tags }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

name: Maven & Docker Build JVM Images

on:
  push:
    branches: [ main, '6.0.0-alpha' ]
  pull_request:
    branches: [ main, '6.0.0-alpha' ]
  # Manual run (Actions > Run workflow), and remote run by snello-admin CI after it publishes a new admin image:
  #   gh workflow run build_jvm.yml -R snello-cms/snello-api --ref 6.0.0-alpha \
  #     -f images=snello-all-in-one -f admin_image=snellocms/snello-admin:sha-<short>
  # Only the all-in-one image contains the admin (Dockerfile.jvm copies it from SNELLO_ADMIN_IMAGE).
  workflow_dispatch:
    inputs:
      images:
        description: 'Images to build: all, or a comma separated list (snello-control,snello-query,snello-mcp,snello-all-in-one)'
        required: false
        default: 'all'
      admin_image:
        description: 'Admin image for snello-all-in-one (default in Dockerfile.jvm: snellocms/snello-admin:edge)'
        required: false
        default: ''
      reason:
        description: 'Why this run was started (shown in the log)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

# One build per branch at a time, queued in start order: a run started earlier can no longer finish later and
# overwrite :alpha with an older admin (the race of 2026-11-18). PR runs have their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_OWNER: snellocms
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:
  # Which images to build: all of them, except on a manual / remote run that names some (inputs.images).
  select:
    name: Select images
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          IMAGES: ${{ inputs.images || 'all' }}
          REASON: ${{ inputs.reason }}
          ADMIN_IMAGE: ${{ inputs.admin_image }}
        run: |
          # snello-all-in-one: one image per database (db = SNELLO_DB_KIND build arg; h2 keeps the plain tags,
          # the others get a -<db> suffix: alpha-postgresql, alpha-mysql, alpha-mssql). Naming the image picks all four.
          ALL='[{"image":"snello-control","module":"snello-control-app"},{"image":"snello-query","module":"snello-query-app"},{"image":"snello-mcp","module":"snello-mcp-app"},{"image":"snello-all-in-one","module":"snello-all-in-one-app","db":"h2"},{"image":"snello-all-in-one","module":"snello-all-in-one-app","db":"postgresql"},{"image":"snello-all-in-one","module":"snello-all-in-one-app","db":"mysql"},{"image":"snello-all-in-one","module":"snello-all-in-one-app","db":"mssql"}]'
          echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF_NAME} images=${IMAGES} admin_image=${ADMIN_IMAGE:-<Dockerfile default>} reason=${REASON:-<none>}"
          if [ "${IMAGES}" = "all" ]; then
            INCLUDE="${ALL}"
          else
            INCLUDE=$(jq -c --arg wanted "${IMAGES}" \
              '($wanted | split(",") | map(gsub("\\s"; ""))) as $w | [.[] | select(.image as $i | $w | index($i))]' <<< "${ALL}")
          fi
          if [ "$(jq length <<< "${INCLUDE}")" = "0" ]; then
            echo "::error::no known image in '${IMAGES}'"; exit 1
          fi
          echo "building: $(jq -r 'map(.image + (if .db then " (" + .db + ")" else "" end)) | join(", ")' <<< "${INCLUDE}")"
          echo "include=${INCLUDE}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}${{ matrix.db && format(' ({0})', matrix.db) || '' }} JVM image
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Extract Maven project version
        run: |
          # quiet when it works; on failure rerun without -q so the log shows why (e.g. a plugin download)
          VERSION=$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout) \
            || { mvn -B help:evaluate -Dexpression=project.version -e; exit 1; }
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Resolve image tags
        id: image_tags
        run: |
          IMAGE="${{ matrix.image }}"
          DB="${{ matrix.db }}"
          # all-in-one on an external database: same image name, tags suffixed with the database
          SUFFIX=""
          if [ -n "${DB}" ] && [ "${DB}" != "h2" ]; then SUFFIX="-${DB}"; fi
          VERSION="${APP_VERSION}${SUFFIX}"
          ALPHA="alpha${SUFFIX}"
          LATEST="latest${SUFFIX}"
          echo "image=${IMAGE} db=${DB:-<n/a>} version tag=${VERSION}"
          DH="${DOCKERHUB_OWNER}/${IMAGE}"
          GH="ghcr.io/${GHCR_OWNER}/${IMAGE}"
          {
            echo "tags<<EOF"
            echo "${DH}:${VERSION}"
            echo "${GH}:${VERSION}"
            if echo "${APP_VERSION}" | grep -qi 'alpha'; then
              echo "${DH}:${ALPHA}"
              echo "${GH}:${ALPHA}"
            else
              echo "${DH}:${LATEST}"
              echo "${GH}:${LATEST}"
            fi
            # Compat alias: control also published as snello-api during alpha
            if [ "${IMAGE}" = "snello-control" ]; then
              echo "${DOCKERHUB_OWNER}/snello-api:${VERSION}"
              echo "ghcr.io/${GHCR_OWNER}/snello-api:${VERSION}"
              if echo "${VERSION}" | grep -qi 'alpha'; then
                echo "${DOCKERHUB_OWNER}/snello-api:alpha"
                echo "ghcr.io/${GHCR_OWNER}/snello-api:alpha"
              else
                echo "${DOCKERHUB_OWNER}/snello-api:latest"
                echo "ghcr.io/${GHCR_OWNER}/snello-api:latest"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Maven Package
        run: mvn -pl ${{ matrix.module }} -am clean package -DskipTests=true

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch JVM image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.module }}
          platforms: linux/amd64,linux/arm64
          file: ./${{ matrix.module }}/src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image_tags.outputs.tags }}
          # pinned admin for the all-in-one image (remote run from snello-admin CI); empty = Dockerfile default (edge).
          # SNELLO_DB_KIND: the all-in-one database (only that Dockerfile reads it)
          build-args: |
            ${{ inputs.admin_image && format('SNELLO_ADMIN_IMAGE={0}', inputs.admin_image) || '' }}
            ${{ matrix.db && format('SNELLO_DB_KIND={0}', matrix.db) || '' }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
